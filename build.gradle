plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'io.rivrs'
version = "1.0"

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven { url = uri("https://repo.codemc.io/repository/maven-releases/") }
    maven { url = uri("https://repo.codemc.io/repository/maven-snapshots/") }
}

dependencies {
    // LibBL n'utilise aucun NMS (net.minecraft / craftbukkit = 0 import) : paperweight est
    // inutile. On compile contre l'API Paper publique (Mojang-mapped depuis 1.20.5).
    compileOnly("io.papermc.paper:paper-api:1.21.10-R0.1-SNAPSHOT")

    // PacketEvents : jamais shadé, jamais relocalisé. Aligné sur la version du core
    // (poudlard-catalog : packetevents = 2.11.1), qui supporte déjà 1.21.10.
    compileOnly("com.github.retrooper:packetevents-spigot:2.11.1")

    compileOnly 'org.projectlombok:lombok:1.+'
    annotationProcessor 'org.projectlombok:lombok:1.+'
}

// Toolchain alignée sur le monorepo Poudlard (Java 21), au lieu du Java 25 de versions/1.21.8.
def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    eachFile { details ->
        if (details.name.contentEquals('plugin.yml') || details.name.contentEquals('bungee.yml')) {
            filter { String line ->
                line.replace('${project.version}', version)
            }
        }
    }
}


publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
